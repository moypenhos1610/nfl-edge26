name: NFL EDGE

on:
  workflow_dispatch:
  schedule:
    # GitHub retrasa los cron "en punto" varias horas (medido: 4-6 h en 2026).
    # Minutos "raros" + horarios más tempranos para llegar antes de los partidos.
    - cron: '23 12 * * 2'   # martes: ya con el Monday Night
    - cron: '23 15 * * 4'   # jueves: congela los picks antes del TNF
    - cron: '23 13 * * 6'   # sábado: designaciones finales del viernes
    - cron: '23 11 * * 0'   # domingo temprano: antes del kickoff de la 1 pm ET

permissions:
  contents: write

concurrency:
  group: nfl-edge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar actualización (si subiste un ZIP)
        run: |
          if [ -f nfl-edge26.zip ]; then
            unzip -qo nfl-edge26.zip -d _tmp
            rm -rf _tmp/nfl-edge/.github _tmp/nfl-edge/docs/data
            cp -r _tmp/nfl-edge/. .
            rm -rf _tmp nfl-edge26.zip
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas rápidas
        run: python tests/test_public_parser.py

      - name: Correr el pipeline
        env:
          NFL_EDGE_SEASON: '2026'
        run: python -m pipeline.run

      - name: Publicar resultados
        run: |
          git config user.name  "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "NFL EDGE: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || (git pull --rebase && git push)
          fi
