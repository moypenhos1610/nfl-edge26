name: NFL EDGE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 2'
    - cron: '0 13 * * 5'
    - cron: '0 15 * * 0'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar el proyecto la primera vez
        run: |
          if [ ! -d pipeline ] && [ -f nfl-edge26.zip ]; then
            unzip -qo nfl-edge26.zip -d _tmp
            rm -rf _tmp/nfl-edge/.github
            cp -r _tmp/nfl-edge/. .
            rm -rf _tmp nfl-edge26.zip
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el pipeline
        env:
          NFL_EDGE_SEASON: '2026'
        run: python -m pipeline.run

      - name: Publicar resultados
        run: |
          git config user.name  "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add -A
          git reset -- .github/workflows
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "NFL EDGE: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
