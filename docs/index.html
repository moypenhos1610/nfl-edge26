<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>NFL EDGE — Decisiones de fantasy</title>
<style>
:root{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --baseline:#383835;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --serious:#ec835a;
  --blue:#3987e5; --blue-dim:#184f95; --aqua:#199e70; --violet:#9085e9;
  --ring:rgba(255,255,255,.10);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:30; background:rgba(13,13,13,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:12px 14px 0;
}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:9px 13px;font-size:13px;font-weight:600;color:var(--muted);
  background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
main{padding:14px 14px 60px;max-width:1100px;margin:0 auto}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
select,input[type=search],button.ghost{
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;
}
input[type=search]{flex:1;min-width:150px}
button.ghost{cursor:pointer}
button.ghost:hover{background:var(--surface-2)}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{
  background:none;border:0;color:var(--muted);padding:8px 11px;font-size:12.5px;
  font-weight:600;cursor:pointer;font-family:inherit;
}
.seg button[aria-pressed="true"]{background:var(--blue-dim);color:#fff}

.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:13px;margin-bottom:10px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--ring);
      border-left:3px solid var(--blue);border-radius:10px;padding:10px 12px;margin-bottom:14px}

/* ---------- semáforo: color + icono + etiqueta, nunca color solo ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
      letter-spacing:.03em;padding:3px 8px;border-radius:999px;border:1px solid}
.pill .ic{font-size:10px;line-height:1}
.verde{color:var(--good);border-color:rgba(12,163,12,.45);background:rgba(12,163,12,.12)}
.amarillo{color:var(--warning);border-color:rgba(250,178,25,.45);background:rgba(250,178,25,.12)}
.conf{color:var(--ink-2);border-color:var(--baseline);background:var(--surface-2)}
.rojo{color:var(--critical);border-color:rgba(208,59,59,.45);background:rgba(208,59,59,.12)}

.prow{display:flex;gap:11px;align-items:flex-start}
.score{
  flex:0 0 52px;text-align:center;border-radius:11px;padding:7px 4px;
  background:var(--surface-2);border:1px solid var(--ring);
}
.score b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{font-size:9.5px;color:var(--muted);letter-spacing:.04em}
.pmain{flex:1;min-width:0}
.pname{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pname strong{font-size:15px}
.meta{font-size:12px;color:var(--muted);margin-top:1px}
.insight{font-size:13px;color:var(--ink-2);margin-top:7px}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:7px;
       font-variant-numeric:tabular-nums}
.stats b{color:var(--ink-2);font-weight:600}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;
     background:rgba(144,133,233,.16);color:var(--violet);border:1px solid rgba(144,133,233,.35)}
.tag.herd{background:rgba(25,158,112,.16);color:var(--aqua);border-color:rgba(25,158,112,.35)}
.star{flex:0 0 auto;background:none;border:0;color:var(--muted);font-size:19px;cursor:pointer;padding:2px 3px}
.star.on{color:var(--warning)}

/* ---------------------------- partidos ---------------------------- */
.game{display:flex;justify-content:space-between;gap:10px;align-items:center}
.team{font-size:15px;font-weight:600}
.teamrec{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--baseline);overflow:hidden;margin:9px 0 3px;display:flex}
.bar i{display:block;height:100%}
.bar i:first-child{background:var(--blue);border-radius:4px 0 0 4px}
.bar i:last-child{background:var(--serious);border-radius:0 4px 4px 0;margin-left:2px}

/* ---------------------------- heatmap ---------------------------- */
.hmwrap{overflow-x:auto;border:1px solid var(--ring);border-radius:var(--r);background:var(--surface)}
table.hm{border-collapse:separate;border-spacing:2px;font-size:11px;width:100%}
table.hm th{color:var(--muted);font-weight:600;text-align:left;padding:5px 6px;
            font-size:10px;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:2}
table.hm th.rowh{left:0;z-index:3;text-align:left}
table.hm td{padding:0}
table.hm td.rowh{position:sticky;left:0;background:var(--surface);color:var(--ink);
                 font-weight:600;padding:5px 8px;z-index:1;font-size:11.5px}
.cell{display:block;min-width:38px;padding:6px 4px;border-radius:4px;text-align:center;
      color:#fff;font-variant-numeric:tabular-nums;font-weight:600;cursor:default}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:9px 2px 0}
.legend .sw{display:flex;gap:2px}
.legend .sw i{width:17px;height:9px;border-radius:2px;display:block}

/* ---------------------------- tabla de jugadores ---------------------------- */
.tblwrap{overflow-x:auto;border:1px solid var(--ring);border-radius:var(--r);
         background:var(--surface);margin-bottom:10px;-webkit-overflow-scrolling:touch}
table.pt{border-collapse:collapse;width:100%;font-size:12.5px;
         font-variant-numeric:tabular-nums}
table.pt th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);
            font-size:10px;font-weight:700;letter-spacing:.04em;text-align:right;
            padding:9px 8px;white-space:nowrap;cursor:pointer;z-index:2;
            border-bottom:1px solid var(--line);user-select:none}
table.pt th:first-child,table.pt td:first-child{text-align:left;position:sticky;left:0;
            background:var(--surface-2);z-index:3;min-width:132px}
table.pt td:first-child{background:var(--surface)}
table.pt th.sorted{color:var(--ink)}
table.pt td{padding:9px 8px;text-align:right;white-space:nowrap;
            border-bottom:1px solid var(--line);color:var(--ink-2)}
table.pt tr.r:active td{background:var(--surface-2)}
table.pt td.nm{color:var(--ink);font-weight:600}
table.pt td.nm small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
     vertical-align:middle}
.dot.verde{background:var(--good)} .dot.amarillo{background:var(--warning)}
.dot.rojo{background:var(--critical)}
.sc{font-weight:700;color:var(--ink)}
.up{color:var(--good)} .down{color:var(--critical)}
tr.exp td{background:var(--surface-2);color:var(--ink-2);font-size:12.5px;
          text-align:left;white-space:normal;line-height:1.5;padding:0}
tr.exp .inner{position:sticky;left:0;width:calc(100vw - 30px);max-width:1070px;
              padding:11px 13px;box-sizing:border-box}
.riskb{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:4px;
       border:1px solid;letter-spacing:.02em}
.risk-ninguno{display:none}
.risk-bajo{color:var(--ink-2);border-color:var(--baseline);background:var(--surface-2)}
.risk-medio{color:var(--warning);border-color:rgba(250,178,25,.45);background:rgba(250,178,25,.12)}
.risk-alto{color:var(--serious);border-color:rgba(236,131,90,.45);background:rgba(236,131,90,.12)}
.risk-fuera{color:var(--critical);border-color:rgba(208,59,59,.45);background:rgba(208,59,59,.12)}

.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:11px;padding:10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--muted)}
details.acc{background:var(--surface);border:1px solid var(--ring);border-radius:11px;padding:10px 12px;margin-bottom:10px}
details.acc summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
details.acc div{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
a{color:var(--blue)}
.tt{position:fixed;pointer-events:none;background:#000;border:1px solid var(--ring);
    border-radius:8px;padding:7px 9px;font-size:11.5px;color:var(--ink-2);z-index:99;display:none;max-width:230px}

/* ============================ PICKS (Partidos) ============================ */
:root{ --home:#3987e5; --away:#b8862b; }
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,131,90,.45)}50%{box-shadow:0 0 0 6px rgba(236,131,90,0)}}
.anim{animation:rise .45s ease both;animation-delay:calc(var(--i,0)*55ms)}
.grow{transition:width .9s cubic-bezier(.2,.8,.2,1), height .9s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.anim{animation:none}.grow{transition:none}.upset-badge{animation:none!important}}

.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hero .kpi{position:relative;overflow:hidden}
.hero .kpi b{font-size:24px;letter-spacing:-.02em}
.hero .kpi small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.sect{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:2px 0 8px}
.big{font-size:17px;font-weight:700;line-height:1.3;margin:0 0 4px}
.sub2{font-size:12.5px;color:var(--ink-2);margin:0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
      padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--blue-dim);border-color:var(--blue);color:#fff}

.g2{border-radius:16px;padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--ring)}
.g2.alert{border-color:rgba(236,131,90,.55)}
.g2top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.when{font-size:11.5px;color:var(--muted)}
.upset-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;
  color:#1a1a19;background:var(--serious);padding:4px 9px;border-radius:999px;animation:pulse 2.2s ease-in-out infinite}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.tm{display:flex;flex-direction:column}
.tm.r{align-items:flex-end;text-align:right}
.tm .ab{font-size:22px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.tm .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.tm .rc{font-size:11.5px;color:var(--muted)}
.vs{font-size:12px;color:var(--muted)}
.pbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:10px 0 4px;gap:2px}
.pbar i{display:block;height:100%;width:0}
.pbar i.a{background:var(--away);border-radius:5px 0 0 5px}
.pbar i.h{background:var(--home);border-radius:0 5px 5px 0}
.plab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.plab .c{color:var(--muted)}

.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pk{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.pk .lb{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted)}
.pk .main{font-size:19px;font-weight:800;margin:3px 0 2px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.pk .main .ck{font-size:13px;color:var(--good)}
.pk .ft{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:12px;height:6px;border-radius:2px;background:var(--baseline)}
.meter.t3 i{background:var(--blue)} .meter.t2 i:nth-child(-n+2){background:var(--blue)}
.meter.t1 i:nth-child(1){background:var(--blue)}
.coin{color:var(--muted)}

.alertbox{margin-top:10px;border-radius:12px;padding:9px 11px;background:rgba(236,131,90,.10);
  border:1px solid rgba(236,131,90,.40);font-size:12.5px;color:var(--ink)}
.alertbox b{color:var(--serious)}

.pub{margin-top:12px}
.pub .row{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;margin-top:6px}
.pub .k{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.split{position:relative;display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.split i{display:flex;align-items:center;height:100%;width:0;font-style:normal;font-size:11px;font-weight:700;
  color:#fff;white-space:nowrap;overflow:hidden;padding:0 7px}
.split i.a{background:var(--away)} .split i.h{background:var(--home);justify-content:flex-end}
.nodata{font-size:11.5px;color:var(--muted)}

.sees{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.see{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);
     background:var(--surface-2);border-radius:10px;padding:8px 10px}
.see .ico{flex:0 0 18px;text-align:center}
details.why{margin-top:10px}
details.why summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary:before{content:"▸ ";} details.why[open] summary:before{content:"▾ ";}
.why .body{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.55}
.seq{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.seq i{width:16px;height:16px;border-radius:4px;font-style:normal;font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center}
.seq .C{background:rgba(12,163,12,.22);color:#5fd35f} .seq .F{background:rgba(208,59,59,.22);color:#ff7b7b}
.seq .P{background:var(--surface);color:var(--muted)}
.res{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid}
.res.W{color:var(--good);border-color:rgba(12,163,12,.5)} .res.L{color:var(--critical);border-color:rgba(208,59,59,.5)}
.res.P{color:var(--muted);border-color:var(--baseline)}

.chart{width:100%;max-width:440px;display:block;overflow:visible;margin:4px 0}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .lbl{fill:var(--ink-2);font-weight:700}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}.hero .kpi b{font-size:20px}}
.mini{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:6px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.how .card{margin:0}
.how .ic{font-size:20px}
.how b{display:block;font-size:13.5px;margin:4px 0 2px}
.how span{font-size:12px;color:var(--ink-2)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>NFL EDGE</h1>
    <span class="sub" id="hdrSub">cargando…</span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="start" aria-selected="true">Start / Sit</button>
    <button class="tab" role="tab" data-view="waivers" aria-selected="false">Waivers</button>
    <button class="tab" role="tab" data-view="games" aria-selected="false">Partidos y picks</button>
    <button class="tab" role="tab" data-view="def" aria-selected="false">Defensas</button>
    <button class="tab" role="tab" data-view="list" aria-selected="false">Mi lista</button>
    <button class="tab" role="tab" data-view="about" aria-selected="false">Cómo funciona</button>
  </div>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div id="alerts"></div>
  <div id="view"><div class="empty">Cargando datos…</div></div>
</main>
<div class="tt" id="tt"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const FMT_LABEL = {ppr:"PPR", half_ppr:"Half", standard:"Standard"};
const POS = ["QB","RB","WR","TE"];
const LIGHT_ICON = {verde:"▲", amarillo:"●", rojo:"▼"};

const S = {
  data:null, index:null, view:"start",
  week:null, fmt:"half_ppr", pos:"ALL", team:"ALL", q:"",
  mode: localStorage.getItem("nfledge.mode") || "tabla",
  sortKey:"start", sortDir:-1, expanded:null,
  watch:new Set(JSON.parse(localStorage.getItem("nfledge.watch")||"[]"))
};
const RISK_ES = {ninguno:"", bajo:"REPORTE", medio:"REPORTE", alto:"DUDOSO", fuera:"FUERA"};

const saveWatch = () =>
  localStorage.setItem("nfledge.watch", JSON.stringify([...S.watch]));

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v,d=1) => (v==null||Number.isNaN(v)) ? "—" : Number(v).toFixed(d);

/* ---------------- carga ---------------- */
async function boot(){
  try{
    S.index = await (await fetch("data/index.json?"+Date.now())).json();
    S.week = S.index.current;
  }catch(e){ S.index = {weeks:[], current:null}; }
  try{ S.latest = await (await fetch("data/latest.json?"+Date.now())).json(); }
  catch(e){ S.latest = null; }
  await loadWeek(S.week);
}
async function loadWeek(w){
  const file = w ? `data/week_${w}.json` : "data/latest.json";
  try{
    S.data = (S.latest && S.latest.meta && S.latest.meta.week === w) ? S.latest
           : await (await fetch(file+"?"+Date.now())).json();
    S.week = S.data.meta.week;
    if(S.data.meta.default_format) S.fmt = S.data.meta.default_format;
  }catch(e){
    $("#view").innerHTML = `<div class="empty">No pude cargar <code>${esc(file)}</code>.<br>
      Si acabas de crear el repo, espera a que corra la primera actualización
      (pestaña <b>Actions</b> en GitHub) o lánzala a mano con <b>Run workflow</b>.</div>`;
    $("#hdrSub").textContent = "sin datos";
    return;
  }
  render();
}

/* ---------------- utilidades de datos ---------------- */
const F = p => p[S.fmt] || {};
function players(){
  let a = (S.data?.players||[]).filter(p => F(p).matchup_score != null);
  if(S.pos !== "ALL") a = a.filter(p => p.pos === S.pos);
  if(S.team !== "ALL") a = a.filter(p => p.team === S.team);
  if(S.q){
    const q = S.q.toLowerCase();
    a = a.filter(p => (p.name||"").toLowerCase().includes(q) ||
                      (p.team||"").toLowerCase().includes(q) ||
                      (p.opp||"").toLowerCase().includes(q));
  }
  return a;
}

/* ---------------- filtros ---------------- */
function renderFilters(){
  const weeks = S.index?.weeks?.length ? S.index.weeks : [S.week];
  const teams = [...new Set((S.data?.players||[]).map(p=>p.team))].filter(Boolean).sort();
  const showPlayerFilters = ["start","waivers","list"].includes(S.view);
  $("#filters").innerHTML = `
    <select id="fWeek" aria-label="Semana">

/* Precisión del semáforo de fantasy: una barra por color, sin párrafos */
function trackPanel(){
  const t = (S.latest||S.data).meta.track_record;
  if(!t || !t.available) return "";
  const f = t.fantasy || {};
  const keys = ["verde","amarillo","rojo"].filter(k=>f[k]);
  if(!keys.length) return "";
  const totalL = keys.reduce((a,k)=>a+f[k].n,0);
  const max = Math.max(...keys.map(k=>Math.abs(f[k].vs_promedio)), 1);
  const gap = (f.verde&&f.rojo) ? f.verde.vs_promedio - f.rojo.vs_promedio : null;
  const rows = keys.map(k=>{
    const v = f[k].vs_promedio, w = Math.abs(v)/max*50;
    return `<div style="display:grid;grid-template-columns:78px 1fr 48px;gap:8px;align-items:center;margin:5px 0"
        data-tip="${k}: ${v>=0?"+":""}${num(v,2)} pts vs su promedio (${f[k].n} casos)">
      <span style="font-size:12px"><span class="dot ${k}"></span>${k}</span>
      <div style="position:relative;height:12px;background:var(--surface-2);border-radius:4px">
        <div style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--baseline)"></div>
        <div class="grow" data-w="${w}" style="position:absolute;top:0;bottom:0;${v>=0?"left:50%":"right:50%"};width:0;
          border-radius:4px;background:var(--${k==="verde"?"good":k==="amarillo"?"warning":"critical"})"></div>
      </div>
      <b style="text-align:right;font-size:12.5px" class="${v>=0?"up":"down"}">${v>=0?"+":""}${num(v,2)}</b>
    </div>`;}).join("");
  return `<div class="card anim">
    <div class="sect">¿FUNCIONA EL SEMÁFORO? · ${m_season()} REAL</div>
    <p class="big">${gap==null?"":`Verde le saca <span class="${gap>=0?"up":"down"}">${gap>=0?"+":""}${num(gap,2)} pts</span> al rojo`}</p>
    <p class="sub2">Puntos por encima (o debajo) del promedio de cada jugador. Meta: verde arriba, rojo abajo.</p>
    ${rows}
    <div class="mini">${totalL} casos · referencia 2025: +0.91 pts${totalL<900?" · muestra aún chica":""}</div>
  </div>`;
}
const m_season = () => (S.data?.meta?.season)||"";

        <span><b>${esc(p.name)}</b> <span class="meta">${esc(p.pos)} · ${esc(p.team)} vs ${esc(p.opp)}</span></span>

const COLS = [
  {k:"name",   t:"JUGADOR", tip:"Jugador · posición, equipo y rival"},
  {k:"score",  t:"MATCH",   tip:"Qué tan bueno es el rival para él (0-100). Verde ≥70"},
  {k:"start",  t:"INICIO",  tip:"Ranking de alineación: calidad + matchup − riesgo de lesión"},
  {k:"games",  t:"J",       tip:"Partidos jugados. Ojo con muestras chicas: un jugador con 3 partidos es ruido"},
  {k:"fppg",   t:"PPJ",     tip:"Puntos fantasy por juego en el formato elegido"},
  {k:"xfp",    t:"xFP",     tip:"Puntos ESPERADOS por juego dada su oportunidad real"},
  {k:"dif",    t:"SUERTE",  tip:"Puntos reales vs esperados. Positivo = venía con suerte (corrección a la baja). Negativo = candidato de compra"},
  {k:"snap",   t:"SNAP%",   tip:"Porcentaje de jugadas ofensivas en el campo"},
  {k:"tgt",    t:"TGT%",    tip:"Porcentaje de los objetivos del equipo que son suyos"},
  {k:"trend",  t:"TEND",    tip:"Tendencia de uso reciente contra su propia línea base"},
  {k:"risk",   t:"ESTADO",  tip:"Reporte de lesiones. Medido 2025: aparecer en él cuesta 0.9 pts aunque practique completo"},
];
const cellVal = (p,k) => {
  const f = F(p);
  switch(k){
    case "name":  return (p.name||"").toLowerCase();
    case "score": return f.matchup_score ?? -1;
    case "start": return f.start_score ?? -1;
    case "games": return p.games ?? 0;
    case "fppg":  return f.fppg ?? -1;
    case "xfp":   return p.xfp_pg ?? -1;
    case "dif":   return (f.fppg!=null && p.xfp_pg!=null) ? f.fppg - p.xfp_pg : -99;
    case "snap":  return p.snap_pct ?? -1;
    case "tgt":   return p.target_share ?? -1;
    case "trend": return p.usage_trend ?? -99;
    case "risk":  return ({fuera:4,alto:3,medio:2,bajo:1,ninguno:0})[p.risk_level] ?? 0;
  }
  return 0;
};
function playerTable(list, scoreKey){
  const head = COLS.map(c=>`<th data-sort="${c.k}" title="${esc(c.tip)}"
      class="${S.sortKey===c.k?"sorted":""}">${c.t}${S.sortKey===c.k?(S.sortDir<0?" ▼":" ▲"):""}</th>`).join("");
  const rows = list.map(p=>{
    const f = F(p), on = S.watch.has(p.pid);
    const dif = (f.fppg!=null && p.xfp_pg!=null) ? f.fppg - p.xfp_pg : null;
    const rk = p.risk_level||"ninguno";
    const main = `<tr class="r" data-pid="${esc(p.pid)}">
      <td class="nm">${on?"★ ":""}${esc(p.name)}
        <small>${esc(p.pos)} · ${esc(p.team)} ${p.is_home?"vs":"@"} ${esc(p.opp)}</small></td>
      <td><span class="dot ${f.light}"></span><span class="sc">${num(f.matchup_score,0)}</span></td>
      <td class="sc">${num(f.start_score,0)}</td>
      <td>${p.games ?? "—"}</td>
      <td>${num(f.fppg)}</td>
      <td>${num(p.xfp_pg)}</td>
      <td class="${dif==null?"":(dif>0?"down":"up")}">${dif==null?"—":(dif>0?"+":"")+num(dif)}</td>
      <td>${p.snap_pct==null?"—":num(p.snap_pct,0)+"%"}</td>
      <td>${p.target_share?num(p.target_share*100,0)+"%":"—"}</td>
      <td class="${(p.usage_trend||0)>=0?"up":"down"}">${p.usage_trend==null?"—":
        ((p.usage_trend>=0?"+":"")+num(p.usage_trend*100,0)+"%")}</td>
      <td>${rk==="ninguno"?'<span style="color:var(--muted)">sano</span>'
            :`<span class="riskb risk-${rk}">${RISK_ES[rk]}</span>`}</td>
    </tr>`;
    const exp = S.expanded===p.pid ? `<tr class="exp"><td colspan="${COLS.length}">
        <div class="inner">${esc(f.insight)}
        <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="ghost" data-star="${esc(p.pid)}">${on?"★ Quitar de mi lista":"☆ Guardar en mi lista"}</button>
        </div></div></td></tr>` : "";
    return main + exp;
  }).join("");
  return `<div class="tblwrap"><table class="pt"><thead><tr>${head}</tr></thead>
          <tbody>${rows}</tbody></table></div>
          <div style="margin:0 2px 14px;font-size:11.5px;color:var(--muted);line-height:1.5">Toca cualquier fila para ver el porqué ·
          toca un encabezado para ordenar · desliza la tabla para ver más columnas</div>`;
}
function bindTable(){
  document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if(S.sortKey===k) S.sortDir *= -1; else { S.sortKey=k; S.sortDir = k==="name"?1:-1; }
    renderView();
  });
  document.querySelectorAll("tr.r").forEach(tr => tr.onclick = e => {

/* --- gráfica: % de acierto contra el spread por semana, con línea de equilibrio --- */
function chartSpreadWeeks(t){
  const wk = (t.by_week||[]).filter(w=>(w.sp.w+w.sp.l)>0);
  if(!wk.length) return "";
  const W=320,H=120,pl=26,pb=18,pt=8,bw=Math.min(28,(W-pl-8)/wk.length-6);
  const y = v => pt + (H-pt-pb)*(1-v/100);
  const be = y(52.4);
  const bars = wk.map((w,i)=>{
    const p = 100*w.sp.w/(w.sp.w+w.sp.l), x = pl+6+i*((W-pl-8)/wk.length);
    const h = (H-pb)-y(p);
    return `<g data-tip="Semana ${w.week}: ${w.sp.w}-${w.sp.l}${w.sp.p?"-"+w.sp.p:""} (${Math.round(p)}%)${w.backfill?" · reconstruida":""}">
      <rect x="${x}" y="${pt}" width="${bw+6}" height="${H-pt-pb}" fill="transparent"/>
      <rect class="grow-h" x="${x+3}" y="${H-pb}" width="${bw}" height="0" data-y="${y(p)}" data-h="${h}" rx="4"
        fill="var(--blue)" opacity="${w.backfill?0.55:1}"/>
      <text x="${x+3+bw/2}" y="${H-4}" text-anchor="middle">S${w.week}</text></g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Acierto contra el spread por semana">
    <text x="0" y="${y(100)+3}">100</text><text x="0" y="${y(50)+3}">50</text>
    <line x1="${pl}" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--baseline)"/>
    ${bars}
    <line x1="${pl}" x2="${W}" y1="${be}" y2="${be}" stroke="var(--ink-2)" stroke-dasharray="4 3" stroke-width="1.5"/>
    <text x="${W}" y="${be-4}" text-anchor="end" class="lbl">52.4% equilibrio</text>
  </svg>`;
}

/* --- gráfica: upsets reales vs esperados por semana --- */
function chartUpsets(sp){
  const wk = sp.by_week||[];
  if(!wk.length) return "";
  const W=320,H=120,pl=18,pb=18,pt=8;
  const mx = Math.max(...wk.map(w=>Math.max(w.upsets,w.expected)),1)+1;
  const y = v => pt+(H-pt-pb)*(1-v/mx);
  const step=(W-pl-8)/wk.length, bw=Math.min(26,step-10);
  const g = wk.map((w,i)=>{
    const x=pl+6+i*step;
    return `<g data-tip="Semana ${w.week}: ${w.upsets} upsets · Vegas esperaba ${num(w.expected,1)}">
      <rect x="${x}" y="${pt}" width="${bw+8}" height="${H-pt-pb}" fill="transparent"/>
      <rect class="grow-h" x="${x+4}" y="${H-pb}" width="${bw}" height="0" data-y="${y(w.upsets)}" data-h="${(H-pb)-y(w.upsets)}" rx="4" fill="var(--away)"/>
      <line x1="${x}" x2="${x+bw+8}" y1="${y(w.expected)}" y2="${y(w.expected)}" stroke="var(--ink)" stroke-width="2.5"/>
      <text x="${x+4+bw/2}" y="${H-4}" text-anchor="middle">S${w.week}</text></g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Upsets por semana contra lo esperado">
    <line x1="${pl}" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--baseline)"/>${g}</svg>
    <div class="legend2"><span><i style="background:var(--away)"></i>upsets reales</span>
      <span><i style="background:var(--ink);height:3px;vertical-align:3px"></i>lo que Vegas esperaba</span></div>`;
}

  // marcador del modelo + patrón de upsets
  if(t.available){
    const tiers = t.spread_tiers||{};
    const sig = ["fuerte","media"].reduce((a,k)=>({w:a.w+((tiers[k]||{}).w||0), l:a.l+((tiers[k]||{}).l||0)}),{w:0,l:0});

        <div class="mini">Barras claras = semanas reconstruidas con la regla nueva (no se publicaron en su momento). Desde la semana ${m.week} todo queda congelado antes del kickoff.</div>
      </div>
      ${sp.available ? `<div class="card anim" style="--i:4">
        <div class="sect">¿MÁS UPSETS DE LO NORMAL?</div>
        <p class="big">${sp.season.upsets} upsets vs ${Math.round(sp.season.upsets_expected)} esperados: ${Math.abs(sp.season.upsets-sp.season.upsets_expected)<=4?"normal":sp.season.upsets>sp.season.upsets_expected?"más de lo normal":"menos de lo normal"}</p>

      </div>` : ""}
    </div>`;
  }
  return h;
}

/* animación: barras crecen, números cuentan */
function animate(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".grow[data-w]").forEach(el=>{ el.style.width = el.dataset.w+"%"; });
    document.querySelectorAll(".grow-h").forEach(el=>{
      el.style.transition="y .9s cubic-bezier(.2,.8,.2,1), height .9s cubic-bezier(.2,.8,.2,1)";
      el.setAttribute("y", el.dataset.y); el.setAttribute("height", Math.max(0,el.dataset.h));
    });
    document.querySelectorAll("[data-count]").forEach(el=>{
      const end = +el.dataset.count; if(!(end>0)) return;
      const t0 = performance.now(), dur = 700;
      const tick = now => { const k = Math.min(1,(now-t0)/dur);
        el.textContent = Math.round(end*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }));
  document.querySelectorAll("[data-gf]").forEach(b=> b.onclick = () => { S.gfilter = b.dataset.gf; renderView(); });
}

/* heatmap: escala DIVERGENTE (azul = defensa dura ↔ rojo = permisiva) */
function divColor(rank){           // rank 1..32
  const t = (rank-1)/31;           // 0 dura, 1 permisiva
  const d = (t-0.5)*2;             // -1..1
  if(Math.abs(d) < 0.06) return "#383835";
  const stops = d<0
    ? ["#383835","#1c5cab","#0d366b"]
    : ["#383835","#b1332f","#7d1f1c"];
  const k = Math.min(Math.abs(d)/1, 1), i = k<0.5?0:1, f = k<0.5?k*2:(k-0.5)*2;
  const hx = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A = hx(stops[i]), B = hx(stops[i+1]);
  const mix = A.map((v,j)=>Math.round(v+(B[j]-v)*f));
  return `rgb(${mix.join(",")})`;
}

      const y = (e.touches?e.touches[0].clientY:e.clientY);
      tt.style.left = Math.min(x+10, innerWidth-240)+"px";
      tt.style.top  = Math.max(y-42, 6)+"px";
    };
    el.addEventListener("mouseenter",show);
    el.addEventListener("mousemove",show);
    el.addEventListener("touchstart",show,{passive:true});
    el.addEventListener("mouseleave",()=>tt.style.display="none");
    el.addEventListener("touchend",()=>setTimeout(()=>tt.style.display="none",1600));
  });
}
boot();
</script>
</body>
</html>
